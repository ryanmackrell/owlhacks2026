<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AquaGuessr</title>

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <!-- Our CSS -->
    <link
        rel="stylesheet"
        href="style.css"
    >
</head>


<body>

    <!-- ========================= -->
    <!-- QUESTION / GAME INFO -->
    <!-- ========================= -->

    <div id="QuestionBox">

        <h1 id="title">
            🌊 AquaGuessr 🌊
        </h1>


        <h2>
            Where does this fish live?
        </h2>


        <!-- Fish information -->
        <div id="fish-container">

            <img
                id="fish-image"
                src=""
                alt="Mystery Fish"
            >

            <h3 id="fish-name">
                ???
            </h3>

        </div>


        <!-- Game information -->
        <div id="game-info">

            <p>
                Round:
                <span id="round-number">
                    1
                </span>
                / 5
            </p>


            <p>
                Score:
                <span id="total-score">
                    0
                </span>
            </p>


            <!--
                This is the ONE game button.

                game.js changes it between:
                Submit Guess
                Loading...
                Next Fish
            -->

            <button id="submit-button">
                Submit Guess
            </button>

        </div>

    </div>


    <!-- ========================= -->
    <!-- RESULT -->
    <!-- ========================= -->

    <p id="result"></p>


    <!--
        Kept because the current game.js still references
        next-button.

        It stays hidden and is NOT used visually.
    -->

    <button
        id="next-button"
        style="display: none;"
    >
        Next Fish
    </button>


    <!-- ========================= -->
    <!-- MAP -->
    <!-- ========================= -->

    <div id="map"></div>


    <!-- ========================= -->
    <!-- JAVASCRIPT -->
    <!-- ========================= -->

    <!-- Leaflet -->
    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    ></script>


    <!-- Controls Leaflet map -->
    <script src="js/map.js"></script>


    <!-- Calculates score -->
    <script src="js/scoring.js"></script>


    <!-- Species data -->
    <script src="js/species.js"></script>


    <!-- Controls game -->
    <script src="js/game.js"></script>

</body>

</html>
