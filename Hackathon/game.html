<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AquaGuessr</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>🌊 Welcome to AquaGuessr 🌊</h1>
    <h2>Guess the animal location!</h2>
    <div id="fish-container">
        <img id="fish-image" src="" alt="Fish">
        <h3 id="fish-name">Fish Name</h3>
    </div>
    <div id="game-info">
        <p>Round: <span id="round-number">1</span> / 5</p>
        <p>Score: <span id="total-score">0</span></p>
    </div>
    <div id="map"></div>
    <button id="start-game">Start Game</button>
    <button id="next-button" style="display: none;">Next Fish</button>
    <p id="result"></p>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/map.js"></script>
    <script src="js/scoring.js"></script>
    <script src="js/game.js"></script>
</body>
</html)
