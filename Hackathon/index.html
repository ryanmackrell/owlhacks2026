<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AquaGuessr</title>

    <!-- Our CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- PyScript -->
    <link
        rel="stylesheet"
        href="https://pyscript.net/releases/2026.7.3/core.css"
    >

    <script
        type="module"
        src="https://pyscript.net/releases/2026.7.3/core.js">
    </script>
</head>


<body class="intro_page">

    <!-- Background image -->
    <div id="background"></div>


    <!-- Main Menu -->
    <main class="menu-card">

        <div class="menu-logo">
            🌊
        </div>


        <h1 class="menu-title">
            AquaGuessr
        </h1>


        <p class="menu-subtitle">
            Test your knowledge of aquatic life around the world.
        </p>


        <div class="menu-divider"></div>


        <p class="menu-description">
            Look at the animal, place your guess on the map,
            and see how well you know where aquatic species live.
        </p>


        <a
            href="game.html"
            class="start-button"
        >
            Start Game
        </a>


        <p class="menu-rounds">
            5 Rounds • 82 Species
        </p>

    </main>


    <!-- PyScript / AI -->
    <script
        type="py"
        src="26 Hackathon.py"
        target="ai_output"
        config="species.json">
    </script>


    <!-- Keep AI output available but out of the menu layout -->
    <div id="ai_output"></div>

</body>

</html>
